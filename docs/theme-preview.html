<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunrise Dental Clinic Theme Preview</title>
<style>
body{font-family:Arial,sans-serif;background:#f7fcfd;color:#113e4a;padding:32px}.card{background:white;border:1px solid #dbecef;border-radius:16px;padding:20px;max-width:900px;margin:auto}.muted{color:#6e8790}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box{background:#eef8fa;border-radius:12px;padding:16px}.btn{display:inline-block;background:#176b7e;color:white;padding:10px 16px;border-radius:10px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>Sunrise Dental Clinic</h1>
  <p class="muted">Interface style preview only. No sample patient, staff, treatment, billing or credential data is included.</p>
  <div class="row">
    <div class="box"><strong>Patients</strong><p class="muted">Registered records appear here.</p></div>
    <div class="box"><strong>Appointments</strong><p class="muted">Scheduled records appear here.</p></div>
    <div class="box"><strong>Billing</strong><p class="muted">Generated receipts appear here.</p></div>
  </div>
  <p><span class="btn">Primary action</span></p>
</div>
</body>
</html>
