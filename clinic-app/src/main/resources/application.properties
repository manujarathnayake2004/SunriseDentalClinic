spring.application.name=sunrise-dental-clinic
server.port=8080

# XAMPP MySQL/MariaDB connection.
# XAMPP normally uses 127.0.0.1:3306 with user root and a blank password.
# If you set a password in XAMPP, provide it with the DB_PASSWORD environment variable.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/sunrise_dental?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo

spring.thymeleaf.cache=false

billing.service.url=${BILLING_SERVICE_URL:http://localhost:8081}

server.error.include-message=never
server.servlet.session.timeout=30m

# Authenticated session/cookie hardening for the local web application.
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
