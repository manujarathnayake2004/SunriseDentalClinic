<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Treatment Form')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments :: sidebar('treatments')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: topbar('Treatment Details','Configure clinic pricing and treatment duration.')}"></header>
        <section class="content">
            <div class="card card-pad form-card">
                <div class="section-head"><div><h2 th:text="${treatment.id == null ? 'Add treatment' : 'Edit treatment'}">Treatment</h2><p>Fees are used by the distributed billing service.</p></div></div>
                <div class="flash flash-error" th:if="${businessError}" th:text="${businessError}"></div>
                <form th:action="@{/treatments/save}" th:object="${treatment}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="form-grid">
                        <div class="form-group full">
                            <label>Treatment Name</label>
                            <input class="input" th:field="*{treatmentName}" placeholder="Enter treatment name">
                            <div class="field-error" th:errors="*{treatmentName}"></div>
                        </div>
                        <div class="form-group">
                            <label>Treatment Cost (Rs.)</label>
                            <input class="input" type="number" min="0" step="0.01" th:field="*{treatmentCost}">
                            <div class="field-error" th:errors="*{treatmentCost}"></div>
                        </div>
                        <div class="form-group">
                            <label>Consultation Fee (Rs.)</label>
                            <input class="input" type="number" min="0" step="0.01" th:field="*{consultationFee}">
                            <div class="field-error" th:errors="*{consultationFee}"></div>
                        </div>
                        <div class="form-group">
                            <label>Duration (minutes)</label>
                            <input class="input" type="number" min="5" max="240" step="5" th:field="*{durationMinutes}">
                            <div class="field-error" th:errors="*{durationMinutes}"></div>
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select class="input" th:field="*{active}">
                                <option th:value="true">Active</option>
                                <option th:value="false">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit">Save Treatment</button>
                        <a class="btn btn-secondary" th:href="@{/treatments}">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
        <footer th:replace="~{fragments :: footer}"></footer>
    </main>
</div>
</body>
</html>
