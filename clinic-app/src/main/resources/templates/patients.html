<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Patients')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments :: sidebar('patients')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: topbar('Patients','Register and maintain patient contact records.')}"></header>
        <section class="content">
            <div th:replace="~{fragments :: flash}"></div>
            <div class="card card-pad">
                <div class="section-head">
                    <div><h2>Patient directory</h2><p>Search by patient name or patient number.</p></div>
                    <a class="btn btn-primary" th:href="@{/patients/new}">＋ Add Patient</a>
                </div>
                <form class="searchbar" method="get" th:action="@{/patients}">
                    <input class="input" type="text" name="q" th:value="${q}" placeholder="Search patients...">
                    <button class="btn btn-secondary" type="submit">Search</button>
                    <a class="btn btn-secondary" th:href="@{/patients}">Clear</a>
                </form>
                <div class="table-wrap" style="margin-top:18px">
                    <table>
                        <thead><tr><th>Patient No.</th><th>Patient Name</th><th>Contact</th><th>Address</th><th>Action</th></tr></thead>
                        <tbody>
                        <tr th:each="p : ${patients}">
                            <td class="table-title" th:text="${p.patientNumber}">Patient number</td>
                            <td th:text="${p.patientName}">Name</td>
                            <td th:text="${p.contactNumber}">Contact</td>
                            <td th:text="${p.address}">Address</td>
                            <td><a class="btn btn-secondary btn-sm" th:href="@{/patients/{id}/edit(id=${p.id})}">Edit</a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(patients)}"><td colspan="5" class="muted">No patient records found.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
        <footer th:replace="~{fragments :: footer}"></footer>
    </main>
</div>
</body>
</html>
