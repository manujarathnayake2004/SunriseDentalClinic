<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Receipt')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments :: sidebar('billing')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: topbar('Patient Receipt','Printable treatment and consultation bill.')}"></header>
        <section class="content">
            <div class="receipt-shell">
                <article class="receipt">
                    <div class="receipt-head">
                        <div class="upper gold small">Private dental care</div>
                        <h2>SUNRISE</h2>
                        <p>DENTAL CLINIC • COLOMBO</p>
                    </div>
                    <div class="receipt-meta">
                        <div><span class="small muted">Bill Number</span><div class="table-title" th:text="${bill.billNumber}">BILL</div></div>
                        <div class="text-right"><span class="small muted">Generated</span><div class="table-title" th:text="${#temporals.format(bill.createdAt,'yyyy-MM-dd HH:mm')}">Date</div></div>
                    </div>

                    <div class="receipt-line"><span>Appointment</span><strong th:text="${bill.appointment.appointmentNumber}">APP</strong></div>
                    <div class="receipt-line"><span>Patient</span><strong th:text="${bill.appointment.patient.patientName}">Patient</strong></div>
                    <div class="receipt-line"><span>Dentist</span><strong th:text="${bill.appointment.dentist.dentistName}">Dentist</strong></div>
                    <div class="receipt-line"><span>Treatment</span><strong th:text="${bill.appointment.treatment.treatmentName}">Treatment</strong></div>
                    <div class="receipt-line"><span>Treatment Fee</span><strong th:text="'Rs. ' + ${#numbers.formatDecimal(bill.treatmentCost,1,'COMMA',2,'POINT')}">0</strong></div>
                    <div class="receipt-line"><span>Consultation Fee</span><strong th:text="'Rs. ' + ${#numbers.formatDecimal(bill.consultationFee,1,'COMMA',2,'POINT')}">0</strong></div>
                    <div class="receipt-total"><span>Total</span><strong th:text="'Rs. ' + ${#numbers.formatDecimal(bill.totalAmount,1,'COMMA',2,'POINT')}">0</strong></div>

                    <div class="receipt-foot">Thank you for choosing Sunrise Dental Clinic.<br>Keep smiling beautifully.</div>
                </article>
                <div class="no-print">
                    <button class="btn btn-primary" onclick="window.print()">Print Receipt</button>
                    <a class="btn btn-secondary" th:href="@{/billing}">Back to Billing</a>
                </div>
            </div>
        </section>
        <footer th:replace="~{fragments :: footer}"></footer>
    </main>
</div>
</body>
</html>
