name: Sunrise Dental Clinic CD

on:
  workflow_run:
    workflows: ["Sunrise Dental Clinic CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  package-latest-version:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout latest successful commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build latest production version
        run: mvn -B -DskipTests package

      - name: Prepare deployment package
        shell: bash
        run: |
          mkdir -p deployment
          find clinic-app/target -maxdepth 1 -name '*.jar' ! -name 'original-*' -exec cp {} deployment/ \;
          find billing-service/target -maxdepth 1 -name '*.jar' ! -name 'original-*' -exec cp {} deployment/ \;
          echo "Sunrise Dental Clinic production deployment package" > deployment/DEPLOYMENT.txt
          echo "Commit: ${{ github.event.workflow_run.head_sha }}" >> deployment/DEPLOYMENT.txt
          echo "Built by GitHub Actions CD workflow" >> deployment/DEPLOYMENT.txt

      - name: Upload latest production deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-dental-clinic-production-${{ github.event.workflow_run.head_sha }}
          path: deployment/
          retention-days: 30

      - name: Deployment summary
        shell: bash
        run: |
          echo "### Sunrise Dental Clinic production package" >> "$GITHUB_STEP_SUMMARY"
          echo "Latest successful commit: ${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "The clinic-app and billing-service JAR files were packaged as the production deployment artifact." >> "$GITHUB_STEP_SUMMARY"
