name: Java CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run automated tests
        run: mvn -B clean test

      - name: Upload automated test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-reports
          path: |
            clinic-app/target/surefire-reports/**
            billing-service/target/surefire-reports/**

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: |
            clinic-app/target/site/jacoco/**
            billing-service/target/site/jacoco/**

      - name: Package applications
        run: mvn -B package -DskipTests

      - name: Upload clinic application artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinic-app
          path: clinic-app/target/*.jar

      - name: Upload billing service artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-service
          path: billing-service/target/*.jar
